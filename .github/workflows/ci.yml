name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'

jobs:
  # ─── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # ─── Test API ──────────────────────────────────────────────────────────────
  test-api:
    name: Test API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: outtask
          POSTGRES_PASSWORD: outtask_test
          POSTGRES_DB: outtask_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://outtask:outtask_test@localhost:5432/outtask_test
      - name: Run migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://outtask:outtask_test@localhost:5432/outtask_test
      - name: Run API tests
        run: pnpm --filter @outtask/api test
        env:
          DATABASE_URL: postgresql://outtask:outtask_test@localhost:5432/outtask_test
          JWT_SECRET: test-jwt-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          NODE_ENV: test

  # ─── Test Web ──────────────────────────────────────────────────────────────
  test-web:
    name: Test Angular Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @outtask/web test

  # ─── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build all apps
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - run: pnpm build

  # ─── E2E (on main only) ────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: outtask
          POSTGRES_PASSWORD: outtask_e2e
          POSTGRES_DB: outtask_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://outtask:outtask_e2e@localhost:5432/outtask_e2e
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://outtask:outtask_e2e@localhost:5432/outtask_e2e
      - run: pnpm db:seed
        env:
          DATABASE_URL: postgresql://outtask:outtask_e2e@localhost:5432/outtask_e2e
      - run: npx playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          DATABASE_URL: postgresql://outtask:outtask_e2e@localhost:5432/outtask_e2e
          JWT_SECRET: e2e-jwt-secret
          JWT_REFRESH_SECRET: e2e-refresh-secret
          NODE_ENV: test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  # ─── Deploy (main only) ────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-api, test-web, build, e2e]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy API
        run: echo "Add your deployment steps here (Azure App Service, Railway, Render, etc.)"
      - name: Deploy Web
        run: echo "Add your SSR deployment steps here (Azure Static Web Apps, Vercel, etc.)"
      - name: Deploy Admin
        run: echo "Add your admin deployment steps here"
